version: "1.0"
linter: qodana-jvm

# Java projects are in the root directory
profile:
  path: .
rootJavaProjects:
  - "./"

# Java 8 is used
projectJDK: "1.8"

# Exclusions
exclude:
  # The plugin is only for building, it is not as important
  - name: Gradle Plugin
    paths:
      - buildSrc
