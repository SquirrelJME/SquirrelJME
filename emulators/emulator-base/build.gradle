import cc.squirreljme.plugin.general.cmake.CMakeBuildTask
import cc.squirreljme.plugin.tasks.MimeDecodeResourcesTask

plugins
{
	id "java-library"
}

description = "This library provides the base support for testing and " +
	"running SquirrelJME on a Java SE host, which is normally not " +
	"capable of doing as such."

// Due to the combination of C++ and Java these dependencies have to be very
// specific in that they only refer to the Java or C++ portion. So
// "implementation" and "compile" cannot be used because the C++ library will
// try to use them during compilation.
dependencies
{
	api project(":modules:cldc-compact")
	api project(":modules:common-vm")
	api project(":modules:vendor-api-squirreljme-io")
	api project(":modules:tac")
	api project(":modules:vendor-api-squirreljme-zip")
	api project(":modules:debug-jdwp")
	api project(":modules:debug-jdwp-vm-host")
	api project(":modules:scritch-ui")
}

// Directory where all natives will be placed
java.nio.file.Path dylibBase = project.buildDir.toPath()
	.resolve("squirreljme").resolve("natives").toAbsolutePath()

static java.nio.file.Path dylibPath(java.nio.file.Path __dylibBase, String __suffix) {
	return __dylibBase.resolve(__suffix)
}

static List<String> dylibArgs(java.nio.file.Path __dylibBase, String __suffix) {
	return [	
		"-DSQUIRRELJME_EMULATOR_BASE_IMPORT_DIR=${dylibPath(__dylibBase, "core")}".toString(),
		"-DSQUIRRELJME_DYLIB_OUTPUT_DIR=${dylibPath(__dylibBase, __suffix)}".toString(),
		"-DSQUIRRELJME_BINARY_OUTPUT_DIR=${dylibPath(__dylibBase, __suffix)}".toString()
	]
}

// Native emulator support library
Provider<CMakeBuildTask> libNativeEmulatorBase = tasks.register(
	"libNativeEmulatorBase",
	CMakeBuildTask.class,
	project.getProjectDir().toPath().getParent()
		.resolve("emulator-base-native"),
	"",
	["libEmulatorBase"],
	dylibArgs(dylibBase, "emulator"))

// NanoCoat core libraries along with ScritchUI and ScritchAudio
Provider<CMakeBuildTask> libNanoCoatCore = tasks.register(
	"libNanoCoatCore",
	CMakeBuildTask.class,
	rootProject.getProjectDir().toPath().resolve("nanocoat"),
	"",
	["BaseStatic", "libJvmDyLib", "ScritchUI", "ScritchAudio"],
	dylibArgs(dylibBase, "core"))

// Add additional output directories
libNativeEmulatorBase.get().outputs.dir(dylibPath(dylibBase, "emulator"))
libNanoCoatCore.get().outputs.dir(dylibPath(dylibBase, "core"))

// The base library needs to exist first
libNativeEmulatorBase.get().dependsOn(libNanoCoatCore)

// Decoding of mime resources
Provider<MimeDecodeResourcesTask> mimeDecode = tasks.register(
	"mimeDecode", MimeDecodeResourcesTask.class,
	"main",
	tasks.named("processResources").get(),
	tasks.named("clean").get())

processResources.dependsOn(mimeDecode)
processResources.dependsOn(libNanoCoatCore)
processResources.dependsOn(libNativeEmulatorBase)

compileJava.dependsOn(libNanoCoatCore)
compileJava.dependsOn(libNativeEmulatorBase)

mimeDecode.get().dependsOn(libNanoCoatCore)
mimeDecode.get().dependsOn(libNativeEmulatorBase)

// Package native libraries into OS and architecture dependent areas
TaskProvider<Zip> archiveNatives = tasks.register('archiveNatives', Zip.class) {
	dependsOn libNanoCoatCore, libNativeEmulatorBase
	
	group = "squirreljme"
	description = "Archives the native SquirrelJME libraries."
	
	destinationDirectory.set(project.buildDir.toPath().resolve("libs").toFile())
	archiveBaseName.set(project.provider({ ->
		return "natives-" + (String)rootProject.squirreljmeSystemDash
	}))
	
	// The sources
	from project.provider({ ->
		return fileTree(dylibPath(dylibBase, "emulator")).getElements()
	})
	from project.provider({ ->
		return fileTree(dylibPath(dylibBase, "core")).getElements()
	})
	
	// Where it is going
	into project.provider({ ->
		return "/natives/" + (String)rootProject.squirreljmeSystemSlash + "/"
	})
} as TaskProvider<Zip>

// We need the native library in the JAR before we can properly use it
// But we can compile the Java code just fine without it
jar {
	dependsOn mimeDecode, archiveNatives
	
	inputs.files(project.provider({ ->
		archiveNatives.get().outputs.getFiles().getSingleFile()
	}))
	
	from project.provider({ ->
		zipTree(archiveNatives.get().outputs.getFiles().getSingleFile())
			.getAsFileTree()
	})
	
	into "/"
}

java {
	// Use a fixed version of the JVM
	compileJava
	{
		sourceCompatibility = JavaVersion.VERSION_1_8
		targetCompatibility = JavaVersion.VERSION_1_8
		
		// Use the default bootstrap classpath
		options.bootstrapClasspath = null
	}

	// Maximize debugging
	compileJava.options.debug = true
	compileJava.options.debugOptions.setDebugLevel("source,lines,vars")

	// Copy settings
	compileTestJava.options.debug = compileJava.options.debug
	compileTestJava.options.debugOptions = compileJava.options.debugOptions
	
	javadoc.options.tags = [ "squirreljme.property",
		"squirreljme.compatibility",
		"squirreljme.env",
		"squirreljme.error",
		"squirreljme.syscallparam",
		"squirreljme.syscallreturn",
		"squirreljme.tsiparam",
		"squirreljme.configtype",
		"squirreljme.uiwidgetparam" ]
}
