# yaml-language-server: $schema=https://raw.githubusercontent.com/cedricziel/idea-concourse/refs/heads/main/src/main/resources/schema/pipeline.json

---
squirreljme_build_natives_run: &squirreljme_build_natives_run
  path: cmake
  args:
   - -S
   - ((checkout.path))/emulators/emulator-base-native
   - -B
   - ((dirty.path))/natives-build
   - BuildCollectAllNatives

jobs:
  ### Building of all the native emulator libraries/binaries ###
  - name: emulator_natives
    public: true
    plan:
      - task: build_linux_aarch64_natives
        config:
          platform: linux-aarch64
          run: *squirreljme_build_natives_run
      - task: build_linux_amd64_natives
        config:
          platform: linux-amd64
          run: *squirreljme_build_natives_run
      - task: build_linux_riscv64_natives
        config:
          platform: linux-riscv64
          run: *squirreljme_build_natives_run
      - task: build_macosx_aarch64_natives
        config:
          platform: macosx-aarch64
          run: *squirreljme_build_natives_run
      - task: build_macosx_amd64_natives
        config:
          platform: macosx-amd64
          run: *squirreljme_build_natives_run
      - task: build_windows_amd64_natives
        config:
          platform: windows-amd64
          run: *squirreljme_build_natives_run
      - task: build_windows_i386_natives
        config:
          platform: windows-i386
          run: *squirreljme_build_natives_run
