plugins {
	id "java"
}

repositories {
	mavenLocal()
	mavenCentral()
	
	maven {
		url = uri("https://plugins.gradle.org/m2/")
	}
}

compileJava {
	// The Java versions this works with
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
	// Lombok for simpler getters/setters
	// Debian: liblombok-java
	implementation 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'
	
	implementation gradleApi()

	// Jasmin Sable (Java byte code assembler)
	implementation "ca.mcgill.sable:jasmin:3.0.3"
	
	// ProGuard, minification
	// Debian: libproguard-java
	implementation "com.guardsquare:proguard-base:7.6.1"
	// Debian: libproguard-core-java
	implementation "com.guardsquare:proguard-core:9.1.8"
	
	// Country codes, this is the last version supporting Java 8
	implementation 'org.iban4j:iban4j:3.2.7-RELEASE'
	
	// CSV parsing, for NanoCoat generation
	// Debian: libcommons-collections4-java 
	implementation 'org.apache.commons:commons-collections4:4.5.0-M3'
	// Debian: libopencsv-java
	implementation 'com.opencsv:opencsv:5.10'
	
	// Shadow Jar, for single Jars
	// Debian: libjengelman-shadow-java
	implementation 'gradle.plugin.com.github.johnrengelman:shadow:7.1.2'
	
	// Jackson, for JSON APIs
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr353:2.17.2'
	implementation 'org.glassfish:javax.json:1.1'
	
	// Install4J, for building installers (10.0.9 supports Java 8)
	implementation 'com.install4j.gradle:com.install4j.gradle.gradle.plugin:10.0.9'
}
